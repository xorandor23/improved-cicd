name: cicd-devsecops

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  pylint-check:
    name: PyLint Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      
      - name: Install Depedencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint
          pip install -r requirements.txt

  bandit-check:
    name: Bandit Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      
      - name: Install Depedencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit
          bandit -r . -ll -ii
  
  deploy-to-vm:
    name: Build & Deploy to VirtualBox VM
    needs: [sast-scan, pylint-check]
    runs-on: self-hosted
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build and Run Container
        run: |
         docker build -t secure-flask-app:latest .
         docker stop web-flask || true
         docker rm web-flask || true
         docker run -d -p 5000:5000 --name web-flask secure-flask-app:latest
         docker ps | grep web-flask
