name: cicd-devsecops

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-images:
    name: Build images with docker
    runs-on: self-hosted
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
      
      - name: Build Docker Images
        run: |
         docker rmi aplikasi-513 || true
         docker build -t aplikasi-513:latest .
    
  trivy:
      name: Scan Images with Trivy
      needs: ['build-images']
      runs-on: self-hosted
      steps:
        - name: Generate Timestamp
          run: echo "TIMESTAMP=$(date +'%Y-%m-%d_%H-%M-%S')" >> $GITHUB_ENV

        - name: Ensure Trivy Cache Directory Exists
          run: mkdir -p $HOME/.cache/trivy

        - name: Scan Images with Trivy
          run: |
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v $HOME/.cache/trivy:/root/.cache/ \
              aquasec/trivy:0.76.1 image \
              --severity HIGH,CRITICAL \
              --exit-code 1 \
              --format table \
              --ignore-unfixed \
              aplikasi-513:latest | tee trivy-scan-${{ env.TIMESTAMP }}.log

        - name: Upload Trivy Logs
          uses: actions/upload-artifact@v4
          if: always()
          with:
            name: trivy-log-${{ env.TIMESTAMP }}
            path: trivy-scan-${{ env.TIMESTAMP }}.log
  
  deploy-to-vm:
    name: Build & Deploy to VirtualBox VM
    needs: ['trivy']
    runs-on: self-hosted
    steps:
      - name: Build and Run Container
        run: |
         docker stop aplikasi-513 || true
         docker rm aplikasi-513 || true
         docker run -d -p 5000:5000 --name aplikasi-513 aplikasi-513:latest
         docker ps | grep aplikasi-513
  
