name: cicd-devsecops

on:
  push:
    branches: ["second"]
  pull_request:
    branches: ["second"]

jobs:
  pylint-check:
    name: PyLint Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      
      - name: Install Depedencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint
          pip install -r requirements.txt

  sast-scan:
    name: Semgrep SAST Scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run Semgrep SAST
       # --exclude=".github" mencegah Semgrep memeriksa file workflow YAML
        run: semgrep scan --config auto --error --verbose --exclude=".github"
  
  audit:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run pip-audit
        uses: pypa/gh-action-pip-audit@v1
        with:
          inputs: requirements.txt # Ubah ke pyproject.toml atau setup.cfg jika sesuai proyek Anda

  gitleaks:
    name: Gitleaks Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Wajib diisi 0 agar Gitleaks bisa memeriksa seluruh riwayat commit

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  
  deploy-to-vm:
    name: Build & Deploy to VirtualBox VM
    needs: [bandit-check, pylint-check]
    runs-on: self-hosted
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build and Run Container
        run: |
         docker build -t secure-flask-app:latest .
         docker stop web-flask || true
         docker rm web-flask || true
         docker run -d -p 5000:5000 --name web-flask secure-flask-app:latest
         docker ps | grep web-flask
